name: Container

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Set image version
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$version-build.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          fi
      - name: Validate application
        run: |
          npm run typecheck
          npm test
          npm audit
          npm --prefix frontend audit
      - uses: docker/setup-buildx-action@v3
      - name: Build image for installation checks
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plex-repairman:ci
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
      - name: Check clean installation, authentication, restart and recovery
        run: node scripts/smoke-container.mjs plex-repairman:ci
      - name: Validate TrueNAS catalog
        run: node scripts/check-truenas-catalog.mjs --image plex-repairman:ci
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
            ghcr.io/${{ github.repository }}:build-${{ github.run_number }}.${{ github.run_attempt }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
